<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep teal background gradient identical to .chat-bubble-orb -->
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D2B24"/>
      <stop offset="45%" stop-color="#164A41"/>
      <stop offset="100%" stop-color="#1F6B5C"/>
    </linearGradient>
    <!-- Subtle glow filter -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#52B79A" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular orb background -->
  <circle cx="32" cy="32" r="28" fill="url(#orbGrad)"/>

  <!-- Halo ring accent (similar to .chat-bubble-orbit) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#52B79A" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Neural-network nodes and links matching .chat-bubble-icon-svg -->
  <!-- Scaled and centered: viewBox 24x24 mapped to 32x32 area starting at (16, 16) -->
  <g transform="translate(8, 8) scale(2)" stroke="#A8E6D2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Connections left → centre -->
    <line x1="5.6" y1="8" x2="10.4" y2="4"/>
    <line x1="5.6" y1="8" x2="10.4" y2="12"/>
    <line x1="5.6" y1="16" x2="10.4" y2="12"/>
    <line x1="5.6" y1="16" x2="10.4" y2="20"/>
    <!-- Connections centre → right -->
    <line x1="13.6" y1="4" x2="18.4" y2="8"/>
    <line x1="13.6" y1="12" x2="18.4" y2="8"/>
    <line x1="13.6" y1="12" x2="18.4" y2="16"/>
    <line x1="13.6" y1="20" x2="18.4" y2="16"/>

    <!-- Nodes filled with bright glowing teal -->
    <circle cx="4"  cy="8"  r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="4"  cy="16" r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="12" cy="4"  r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="12" cy="12" r="2.0" fill="#E8FDF5" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="12" cy="20" r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="20" cy="8"  r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
    <circle cx="20" cy="16" r="1.8" fill="#A8E6D2" stroke="#164A41" stroke-width="0.6"/>
  </g>
</svg>
